<h1>Virtual scroll view example:</h1>

<cdk-virtual-scroll-viewport class="wrapper mat-elevation-z2" tableVirtualScroll>
  <mat-table [dataSource]="dataSource" [trackBy]="trackByFn">
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>#</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.id !== -1 ? row.id : '' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let row">
        <input
          class="row-input"
          [class.invalid]="row.validator.controls.name.invalid"
          [formControl]="row.validator.controls.name"
          placeholder="Name"
        />
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="age">
      <mat-header-cell *matHeaderCellDef>Age</mat-header-cell>
      <mat-cell *matCellDef="let row">
        <input
          class="row-input"
          [class.invalid]="row.validator.controls.age.invalid"
          [formControl]="row.validator.controls.age"
          type="number"
          placeholder="Age"
        />
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actionsColumn">
      <mat-header-cell *matHeaderCellDef>
        <button mat-icon-button color="accent" (click)="dataSource.createNew()">
          <mat-icon>add_circle</mat-icon>
        </button>
        <button mat-button color="accent" (click)="dataSource.confirmAllRows()">
          <mat-icon>done_all</mat-icon>
          Validate all
        </button>

        <button mat-button color="accent" (click)="dataSource.addMany(generatePersons(50))">
          <mat-icon>done_all</mat-icon>
          Add many
        </button>
      </mat-header-cell>

      <mat-cell *matCellDef="let row">
        @if (!row.editing) {
          <button mat-icon-button color="primary" tabindex="-1" (click)="row.startEdit()">
            <mat-icon>edit</mat-icon>
          </button>
        }
        @if (row.editing) {
          <button mat-icon-button color="primary" (click)="row.confirmEditCreate()" [disabled]="row.pending">
            <mat-icon>done</mat-icon>
          </button>
        }
        <button mat-icon-button color="primary" tabindex="-1" (click)="row.cancelOrDelete()" [disabled]="row.pending">
          @if (row.editing) {
            <mat-icon>undo</mat-icon>
          }
          @if (!row.editing) {
            <mat-icon>delete</mat-icon>
          }
        </button>
        @if (!row.editing) {
          <button mat-icon-button color="primary" tabindex="-1" (click)="row.move(-1)" [disabled]="row.pending">
            <mat-icon>arrow_upward</mat-icon>
          </button>
        }
        @if (!row.editing) {
          <button mat-icon-button color="primary" tabindex="-1" (click)="row.move(1)" [disabled]="row.pending">
            <mat-icon>arrow_downward</mat-icon>
          </button>
        }
        @if (row.pending) {
          <mat-spinner diameter="24"></mat-spinner>
        }
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>
</cdk-virtual-scroll-viewport>
